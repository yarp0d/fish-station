- author: Kaiten
  changes:
  - message: "Исправление КЗ под сроки и статьи рыбы."
    type: Fix
  - message: "Трансформация в лису теперь длится 4 минуты, чтобы людей не выкидывало неизвестно куда."
    type: Tweak
  - message: "Исправлены баги расы кицунэ."
    type: Fix
  - message: "Обновлён гардероб офицеров ЦК и ОСО."
    type: Tweak
  - message: "Исправлена печать Инструктора СБ."
    type: Fix
  - message: "Лимитки теперь взрываются в радиусе одного тайла. Делайте химические гранаты как взрослые мальчики."
    type: Tweak
  - message: "Обновлена плюшка Михаила Пивноборода."
    type: Tweak
  - message: "Добавлена Планетарная война как отдельный постоянный режим игры."
    type: Add
  - message: "Добавлена Планета Вульп как секретный режим игры."
    type: Add
  - message: "Исправлены баги разумной болезни."
    type: Fix
  - message: "По умолчанию игроки появляются в крио, если не выбрали другое место появления. Это уменьшит число жертв гибов от шаттлов Вигерса."
    type: Tweak
  - message: "Исправлены баги Планетарной войны."
    type: Fix
  id: 3
  time: "2026-07-25T12:45:00.000000+00:00"

- author: Pifagor
  changes:
  - message: "Добавлена уникальная верхняя одежда для роли «Секторальный судья» — Мантия Секторального суда."
    type: Add
  - message: "Эскадрон Смерти на станции получил отдельную Fish-экипировку: скафандр, шлем, маску с тепловизором, магнитные ботинки и боевые перчатки со встроенным аплинком."
    type: Tweak
  - message: "Для Эскадрона Смерти добавлены два варианта перчаток с аплинком: стандартный — за 200 синих кристаллов и 200 кристаллитов, а также бюджетный — за 80 синих кристаллов и 80 кристаллитов."
    type: Add
  - message: "Маска Эскадрона Смерти получила встроенный тепловизор."
    type: Add
  - message: "Добавлен спавнер персонажей игроков из гостов для ивентов. Ghost Character Spawner поддерживает массив фракций в YAML. Добавлены готовые варианты для ивентов Синдиката (Syndicate + Pirate) и пиратов (Pirate)."
    type: Add
  - message: "У кицунэ теперь виден хвост через скафандры."
    type: Tweak
  - message: "Добавлена новая админ-команда, форсирующая гост-роль на объекте."
    type: Add
  - message: "Добавлены прозрачные плиты и тайлы для мапперов."
    type: Add
  - message: "Добавлена админ-панель для отслеживания производительности сервера с указанием возможных причин и виновников. Открывается по F7."
    type: Add
  - message: "Добавлены админ-предупреждения, когда силовые поля у теслы и сингулярности разряжаются."
    type: Add
  id: 4
  time: "2026-07-25T12:45:00.000000+00:00"

