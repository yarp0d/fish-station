- author: Alexnov33X
  changes:
  - message: "Все скафандры и хардсьюты теперь дают 50% защиты от болезни; стерильная маска также даёт 50% защиты."
    type: Tweak
  - message: "Перчатки на заражённом теперь полностью блокируют передачу инфекции при объятиях."
    type: Tweak
  - message: "Защита на больном теперь снижает вероятность распространения болезни через кашель и чихание."
    type: Tweak
  - message: "Понижена минимальная дозировка лекарств для лечения болезни: Антивирусин — до 9u, Антивирусин+ — до 4u, Иммунатор — до 4u."
    type: Tweak
  - message: "Добавлены уникальные названия и описания крови трёх штаммов болезни: мутной, липемической и гнилой крови."
    type: Add
  id: 23
  time: "2026-08-17T20:30:00.0000000+00:00"

